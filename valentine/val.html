  <style>
    * {
      font-family: 'Press Start 2P', cursive;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes pulse-heart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }
    
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes shake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      10% { transform: rotate(-2deg) scale(1.05); }
      20% { transform: rotate(2deg) scale(1.05); }
      30% { transform: rotate(-2deg) scale(1.05); }
      40% { transform: rotate(2deg) scale(1.05); }
      50% { transform: rotate(0deg) scale(1.05); }
      60% { transform: rotate(-1deg) scale(1.03); }
      70% { transform: rotate(1deg) scale(1.03); }
      80% { transform: rotate(0deg) scale(1); }
      90% { transform: rotate(0deg) scale(1); }
    }
    
    @keyframes shake-wrong {
      0%, 100% { transform: translateX(0); }
      10% { transform: translateX(-10px); }
      20% { transform: translateX(10px); }
      30% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      50% { transform: translateX(0); }
    }
    
    @keyframes fade-in-text {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pop-in {
      from { 
        opacity: 0; 
        transform: scale(0.8);
      }
      to { 
        opacity: 1; 
        transform: scale(1);
      }
    }
    
    .float-animation {
      animation: float 3s ease-in-out infinite;
    }
    
    .pulse-heart {
      animation: pulse-heart 1s ease-in-out infinite;
    }
    
    .sparkle {
      animation: sparkle 2s ease-in-out infinite;
    }
    
    .slide-up {
      animation: slide-up 0.8s ease-out forwards;
    }
    
    .shake-heart {
      animation: shake 0.6s ease-in-out;
    }
    
    .shake-wrong {
      animation: shake-wrong 0.5s ease-in-out;
    }
    
    .fade-in-text {
      animation: fade-in-text 0.8s ease-out;
    }

    .pop-in {
      animation: pop-in 0.5s ease-out;
    }
    
    .pixel-border {
      box-shadow: 
        4px 0 0 0 currentColor,
        -4px 0 0 0 currentColor,
        0 4px 0 0 currentColor,
        0 -4px 0 0 currentColor;
    }
    
    .pixel-shadow {
      box-shadow: 
        4px 4px 0 0 rgba(0,0,0,0.3);
    }
    
    /* Login Screen */
    .login-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1a0a1f 0%, #2d1b35 50%, #1a0a1f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 1;
      transition: opacity 0.5s ease-out;
    }
    
    .login-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .login-container {
      text-align: center;
      max-width: 500px;
      padding: 40px;
    }
    
    .login-input {
      width: 100%;
      max-width: 300px;
      padding: 12px 16px;
      font-size: 12px;
      border: 4px solid #ff6b9d;
      background: white;
      margin: 20px auto;
      display: block;
      box-sizing: border-box;
    }
    
    .login-btn {
      background: #ff6b9d;
      color: #1a0a1f;
      border: 4px solid #ff6b9d;
      padding: 12px 32px;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
      transition: all 0.2s;
      margin-top: 20px;
    }
    
    .login-btn:hover {
      transform: scale(1.05);
    }
    
    .login-btn:active {
      transform: scale(0.95);
    }
    
    .error-message {
      color: #ff6b9d;
      font-size: 12px;
      margin-top: 20px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-link {
      background: #ff6b9d;
      color: #1a0a1f;
      border: 4px solid #ff6b9d;
      padding: 12px 24px;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
      transition: all 0.2s;
      font-family: 'Press Start 2P', cursive;
      text-decoration: none;
      display: inline-block;
    }

    .menu-link:hover {
      transform: scale(1.05);
    }

    .menu-link:active {
      transform: scale(0.95);
    }

    .menu-text {
      display: inline;
    }
  </style>

      "Your love is my favorite game I never want to lose! 🎮💕",
      "You're my happily ever after! 👑💕",
      "I love everything about you! 💯💕",
      "You're my reason to smile! 😊💕",
      "Every heartbeat of mine whispers your name! 💗",
      "You're my forever person! 💍💕",
      "Being with you is my greatest joy! 🎆💕"
    ];
    
    let score = 0;
    let loveLevel = 0;
    let correctName = defaultConfig.correct_name;
    let isLoggedIn = false;
    let lastTextLevel = -1;
    let albumUnlocked = false;
    let usedNotes = new Set();
    let loveNoteInterval = null;
    
    const achievements = [
      { threshold: 1, text: "FIRST LOVE!" },
      { threshold: 5, text: "LOVE NOVICE" },
      { threshold: 10, text: "CUPID'S HELPER" },
      { threshold: 25, text: "LOVE MASTER" },
      { threshold: 50, text: "LEGEND OF LOVE" }
    ];
    let earnedAchievements = new Set();
    
    async function onConfigChange(config) {
      correctName = config.correct_name || defaultConfig.correct_name;
      const mainTitle = document.getElementById('main-title');
      const loveMessage = document.getElementById('love-message');
      const loveBtn = document.getElementById('love-btn');
      const appWrapper = document.getElementById('app-wrapper');
      
      const primaryColor = config.primary_color || defaultConfig.primary_color;
      const secondaryColor = config.secondary_color || defaultConfig.secondary_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const accentColor = config.accent_color || defaultConfig.accent_color;
      const backgroundColor = config.background_color || defaultConfig.background_color;
      const fontFamily = config.font_family || defaultConfig.font_family;
      const fontSize = config.font_size || defaultConfig.font_size;
      
      mainTitle.textContent = config.main_title || defaultConfig.main_title;
      loveMessage.textContent = config.love_message || defaultConfig.love_message;
      
      appWrapper.style.background = `linear-gradient(135deg, ${backgroundColor} 0%, ${secondaryColor} 50%, ${backgroundColor} 100%)`;
      mainTitle.style.color = primaryColor;
      mainTitle.style.textShadow = `4px 4px 0 ${secondaryColor}`;
      loveMessage.style.color = textColor;
      loveBtn.style.background = primaryColor;
      loveBtn.style.color = backgroundColor;
      
      const loveBar = document.getElementById('love-bar');
      loveBar.style.background = `linear-gradient(90deg, ${primaryColor}, ${accentColor})`;
      document.getElementById('love-percent').style.color = accentColor;
      
      document.querySelectorAll('.float-animation').forEach((heart, i) => {
        heart.style.color = i % 2 === 0 ? primaryColor : accentColor;
      });
      
      const baseFontStack = 'cursive';
      document.querySelectorAll('*').forEach(el => {
        el.style.fontFamily = `${fontFamily}, ${baseFontStack}`;
      });
      
      mainTitle.style.fontSize = `${fontSize * 2}px`;
      loveMessage.style.fontSize = `${fontSize * 0.75}px`;
    }
    
    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => {
              config.background_color = value;
              window.elementSdk.setConfig({ background_color: value });
            }
          },
          {
            get: () => config.secondary_color || defaultConfig.secondary_color,
            set: (value) => {
              config.secondary_color = value;
              window.elementSdk.setConfig({ secondary_color: value });
            }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => {
              config.text_color = value;
              window.elementSdk.setConfig({ text_color: value });
            }
          },
          {
            get: () => config.primary_color || defaultConfig.primary_color,
            set: (value) => {
              config.primary_color = value;
              window.elementSdk.setConfig({ primary_color: value });
            }
          },
          {
            get: () => config.accent_color || defaultConfig.accent_color,
            set: (value) => {
              config.accent_color = value;
              window.elementSdk.setConfig({ accent_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (value) => {
            config.font_family = value;
            window.elementSdk.setConfig({ font_family: value });
          }
        },
        fontSizeable: {
          get: () => config.font_size || defaultConfig.font_size,
          set: (value) => {
            config.font_size = value;
            window.elementSdk.setConfig({ font_size: value });
          }
        }
      };
    }
    
    function mapToEditPanelValues(config) {
      return new Map([
        ["main_title", config.main_title || defaultConfig.main_title],
        ["love_message", config.love_message || defaultConfig.love_message],
        ["button_text", config.button_text || defaultConfig.button_text],
        ["song_url", config.song_url || defaultConfig.song_url],
        ["correct_name", config.correct_name || defaultConfig.correct_name]
      ]);
    }
    
    function checkLogin() {
      const nameInput = document.getElementById('name-input').value.trim().toLowerCase();
      const errorMsg = document.getElementById('error-msg');
      
      if (nameInput === correctName.toLowerCase()) {
        isLoggedIn = true;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-wrapper').classList.remove('hidden');
        document.getElementById('lover-name').textContent = `👋 ${nameInput.toUpperCase()}!`;
        
        // Play background music
        const audio = document.getElementById('background-music');
        if (audio) {
          audio.volume = 0.3;
          audio.play().catch(err => console.log('Music autoplay prevented'));
        }

        // Start auto-rotating love notes
        showLoveNote();
        loveNoteInterval = setInterval(showLoveNote, 5000);
      } else {
        errorMsg.textContent = "you're not my lover!!!";
        const loginScreen = document.getElementById('login-screen');
        loginScreen.classList.add('shake-wrong');
        setTimeout(() => {
          loginScreen.classList.remove('shake-wrong');
          document.getElementById('name-input').value = '';
        }, 500);
      }
    }
    
    function updateStoryText() {
      const storyBox = document.getElementById('story-box');
      const storyText = document.getElementById('story-text');
      let textLevel = 0;
      
      if (loveLevel >= 20) textLevel = 1;
      if (loveLevel >= 40) textLevel = 2;
      if (loveLevel >= 60) textLevel = 3;
      if (loveLevel >= 80) textLevel = 4;
      if (loveLevel >= 90) textLevel = 5;
      
      if (loveLevel >= 100 && !albumUnlocked) {
        albumUnlocked = true;
        // Clear and show album unlock button with menu-link structure
        storyBox.innerHTML = '';
        const unlockLink = document.createElement('a');
        unlockLink.href = 'album.html';
        unlockLink.className = 'menu-link';
        
        const menuText = document.createElement('span');
        menuText.className = 'menu-text';
        menuText.textContent = 'ALBUM UNLOCKED';
        
        unlockLink.appendChild(menuText);
        storyBox.appendChild(unlockLink);
      } else if (textLevel !== lastTextLevel && loveLevel < 100) {
        lastTextLevel = textLevel;
        storyText.classList.remove('fade-in-text');
        void storyText.offsetWidth;
        storyText.classList.add('fade-in-text');
        storyText.textContent = storyTexts[textLevel];
      }
    }

    function getRandomLoveNote() {
      if (usedNotes.size === loveNotes.length) {
        usedNotes.clear();
      }

      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * loveNotes.length);
      } while (usedNotes.has(randomIndex));

      usedNotes.add(randomIndex);
      return loveNotes[randomIndex];
    }

    function showLoveNote() {
      const noteText = document.getElementById('love-note-text');
      const newNote = getRandomLoveNote();

      noteText.classList.remove('pop-in');
      void noteText.offsetWidth;
      noteText.classList.add('pop-in');
      noteText.textContent = newNote;
    }
    
    function showAchievement(text) {
      const achievement = document.getElementById('achievement');
      const achievementText = document.getElementById('achievement-text');
      achievementText.textContent = text;
      achievement.style.opacity = '1';
      achievement.style.transform = 'translateX(-50%) translateY(0)';
      
      setTimeout(() => {
        achievement.style.opacity = '0';
        achievement.style.transform = 'translateX(-50%) translateY(-20px)';
      }, 2500);
    }
    
    function updateLoveLevel() {
      loveLevel = Math.min(100, Math.floor(score * 2));
      const loveBar = document.getElementById('love-bar');
      const lovePercent = document.getElementById('love-percent');
      
      loveBar.style.width = loveLevel + '%';
      lovePercent.textContent = loveLevel + '%';
      
      updateStoryText();
    }
    
    function checkAchievements() {
      for (const achievement of achievements) {
        if (score >= achievement.threshold && !earnedAchievements.has(achievement.threshold)) {
          earnedAchievements.add(achievement.threshold);
          showAchievement(achievement.text);
          break;
        }
      }
    }
    
    function sendLove() {
      score++;
      updateLoveLevel();
      checkAchievements();
      
      const mainHeart = document.getElementById('main-heart');
      mainHeart.classList.remove('shake-heart');
      void mainHeart.offsetWidth;
      mainHeart.classList.add('shake-heart');
      
      const heart = document.createElement('div');
      heart.textContent = '♥';
      heart.style.cssText = `
        position: fixed;
        left: ${Math.random() * 80 + 10}%;
        bottom: 20%;
        font-size: ${Math.random() * 20 + 20}px;
        color: ${window.elementSdk?.config?.primary_color || '#ff6b9d'};
        pointer-events: none;
        z-index: 100;
        animation: floatUp 1.5s ease-out forwards;
      `;
      document.body.appendChild(heart);
      
      setTimeout(() => heart.remove(), 1500);
    }
    
    const style = document.createElement('style');
    style.textContent = `
      @keyframes floatUp {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-200px) scale(0.5); opacity: 0; }
      }
    `;
    document.head.appendChild(style);
    
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
    
    document.getElementById('love-btn').addEventListener('click', sendLove);
    document.getElementById('login-btn').addEventListener('click', checkLogin);
    document.getElementById('name-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        checkLogin();
      }
    });
  </script>
